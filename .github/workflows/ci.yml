name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## 📊 Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "const c=require('./coverage/coverage-summary.json').total;console.log('| Metric | % | Covered/Total |\n|---|---|---|');for(const k of ['lines','statements','functions','branches']){const m=c[k];console.log(\`| \${k} | \${m.pct}% | \${m.covered}/\${m.total} |\`)}" >> $GITHUB_STEP_SUMMARY
          fi
